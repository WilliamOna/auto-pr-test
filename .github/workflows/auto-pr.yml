name: Auto PR Agent

on:
  issues:
    types: [opened, reopened, labeled]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: pr-review-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  coder:
    if: github.event_name == 'issues'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Generate code from issue
        env:
          OLLAMA_HOST: http://ollama:11434
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.email "coder-bot@users.noreply.github.com"
          git config --global user.name "coder-bot"
          git config --global credential.helper "!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f"
          BRANCH="issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
          opencode run "Implement this issue: ${{ github.event.issue.title }}" \
            -f "$GITHUB_EVENT_PATH" \
            --dangerously-skip-permissions
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "${{ github.event.issue.title }}"
          git push origin "$BRANCH"
          gh pr create --title "${{ github.event.issue.title }}" \
            --body "${{ github.event.issue.body }}

            Closes #${{ github.event.issue.number }}" \
            --base ${{ github.event.repository.default_branch }}

  review-and-fix:
    if: |
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'ready-for-human')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate bot token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Review and fix loop
        env:
          OLLAMA_HOST: http://ollama:11434
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global user.email "fixer-bot@users.noreply.github.com"
          git config --global user.name "fixer-bot"
          git config --global credential.helper "!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f"
          MAX_LOOPS=5
          PREV_COMMENT_COUNT=$(gh api "repos/$OWNER/$REPO/pulls/$PR_NUM/comments" --jq 'length')
          for ((i=0; i<MAX_LOOPS; i++)); do
            echo "=== Review round $((i+1))/$MAX_LOOPS ==="
            git pull origin "$BRANCH"
            COMMIT_SHA=$(git rev-parse HEAD)
            opencode run "Review this PR and suggest improvements. Use gh api (NOT curl). Submit a COMMENT review with general feedback via: gh api --method POST /repos/$OWNER/$REPO/pulls/$PR_NUM/reviews -f event=COMMENT -f body='general feedback'. Then for each inline comment, first get the latest commit SHA with: LATEST_SHA=\$(gh pr view $PR_NUM --json headRefOid --jq .headRefOid); then post: gh api --method POST /repos/$OWNER/$REPO/pulls/$PR_NUM/comments -f body='your comment' -f path='src/index.js' -f line=<N> -f commit_id=\$LATEST_SHA. Sign all reviews and comments with '--- review-bot'. If the code looks good and has no issues, submit an APPROVE review instead of COMMENT." \
              -f "$GITHUB_EVENT_PATH" \
              --dangerously-skip-permissions
            sleep 3
            LATEST_REVIEW=$(gh api "repos/$OWNER/$REPO/pulls/$PR_NUM/reviews" --jq '.[-1] // empty')
            if [ -z "$LATEST_REVIEW" ] || [ "$LATEST_REVIEW" = "null" ]; then
              echo "No review posted. Stopping."
              gh api "repos/$OWNER/$REPO/issues/$PR_NUM/labels" -f labels[]="ready-for-human"
              exit 0
            fi
            STATE=$(echo "$LATEST_REVIEW" | jq -r '.state // empty')
            NEW_COMMENT_COUNT=$(gh api "repos/$OWNER/$REPO/pulls/$PR_NUM/comments" --jq 'length')
            DELTA=$((NEW_COMMENT_COUNT - PREV_COMMENT_COUNT))
            echo "Review state: $STATE, new inline comments this round: $DELTA"
            if [ "$STATE" = "APPROVED" ]; then
              gh api "repos/$OWNER/$REPO/issues/$PR_NUM/labels" -f labels[]="ready-for-human"
              echo "Review approved. Ready for human review."
              exit 0
            fi
            if [ "$DELTA" -eq 0 ]; then
              gh api "repos/$OWNER/$REPO/issues/$PR_NUM/labels" -f labels[]="ready-for-human"
              echo "No new inline comments. Ready for human review."
              exit 0
            fi
            REVIEW_BODY=$(echo "$LATEST_REVIEW" | jq -r '.body // ""')
            opencode run "Address all review comments on this PR. Read the review body and fix the code accordingly. Review body: $REVIEW_BODY. After fixing the code, reply to each inline comment explaining what you changed. First get all comments via: gh api /repos/$OWNER/$REPO/pulls/$PR_NUM/comments. To reply to a comment, use: gh api --method POST /repos/$OWNER/$REPO/pulls/$PR_NUM/comments -f body='Fixed: <explanation>' -f in_reply_to=<comment_id>. Sign replies with '--- fixer-bot'." \
              -f "$GITHUB_EVENT_PATH" \
              --dangerously-skip-permissions
            git add -A
            if git diff --cached --quiet; then
              echo "No changes from fix. Stopping."
              gh api "repos/$OWNER/$REPO/issues/$PR_NUM/labels" -f labels[]="ready-for-human"
              exit 0
            fi
            git commit -m "fix: address review round $((i+1))"
            git push origin "$BRANCH"
            PREV_COMMENT_COUNT=$NEW_COMMENT_COUNT
          done
          gh api "repos/$OWNER/$REPO/issues/$PR_NUM/labels" -f labels[]="ready-for-human"
          gh api "repos/$OWNER/$REPO/issues/$PR_NUM/comments" \
            -f body="**review-bot**: Max 5 review-fix cycles reached without full approval. Please review the remaining comments and address them manually, or remove the \`ready-for-human\` label to trigger up to 3 more cycles via local skill."
